name: CI

on:
  push:
    branches:
      - main
      - feat/bundling-preparation
  pull_request:
    branches:
      - main

jobs:
  compute_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: graycoreio/github-actions-magento2/supported-version@v8.11.0 # x-release-please-version
        id: supported-version
      - id: matrix
        env:
          MATRIX: ${{ steps.supported-version.outputs.matrix }}
        run: |
          echo "matrix=$(jq -c --arg v '2.4.7-p10' \
            '.magento |= map(select(endswith(":" + $v) | not)) | .include |= map(select(.version != $v))' \
            <<< "$MATRIX")" >> "$GITHUB_OUTPUT"
      - env:
          MATRIX: ${{ steps.matrix.outputs.matrix }}
        run: echo "$MATRIX"
  check-extension:
    needs: compute_matrix
    uses: graycoreio/github-actions-magento2/.github/workflows/check-extension.yaml@v8.11.0 # x-release-please-version
    with:
      matrix: ${{ needs.compute_matrix.outputs.matrix }}
    secrets:
      composer_auth: ${{ secrets.COMPOSER_AUTH }}

  infection:
    name: Mutation testing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', coverage: pcov }
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/infection --threads=4 --no-progress
