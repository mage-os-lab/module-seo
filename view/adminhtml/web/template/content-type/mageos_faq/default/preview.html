<div class="pagebuilder-content-type"
     attr="data.main.attributes"
     ko-style="data.main.style"
     css="data.main.css"
     event="{ mouseover: onMouseOver, mouseout: onMouseOut }, mouseoverBubble: false">

    <render args="getOptions().template"></render>

    <div style="padding: 24px; background: #f5f5f5; border: 1px dashed #ccc; text-align: center;">
        <strong translate="'FAQ'"></strong>
        <div if="data.main.attributes['data-identifier']" style="color: #555; margin-top: 4px;">
            <span translate="'Group:'"></span>
            <span text="data.main.attributes['data-identifier']"></span>
        </div>
        <div ifnot="data.main.attributes['data-identifier']" style="color: #999; margin-top: 4px;">
            <span translate="'Open settings to choose a FAQ group identifier.'"></span>
        </div>
    </div>
</div>
